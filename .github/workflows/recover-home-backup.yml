name: Recover interrupted home backup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-home-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-home-backup
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 8
    env:
      SCAN_EXECUTOR_KIND: home
      PYTHONUTF8: '1'
    steps:
      - name: Get tested recovery code without cleaning checkpoint folder
        uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: ecafd84f521cdbe7ec6c13b82d953254012e1a2a
          token: ${{ secrets.DATA_TOKEN }}
          path: recovery-source
          persist-credentials: false
      - name: Select native Python
        shell: powershell
        run: ./recovery-source/jx_fares/tools/Select-WindowsRunnerTools.ps1
      - name: Save interrupted checkpoint and release exact completed lease
        shell: powershell
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          RECOVERY_RUN_TOKEN: ${{ github.token }}
        run: ./recovery-source/jx_fares/tools/Recover-LocalCheckpoint.ps1 -Device home
      - name: Install widget v11 and enable backup continuous controller
        shell: powershell
        run: |
          param()
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet'
          $taskName='AS-Award-Continuous-home-backup'
          $controller=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if ($controller.State -eq 'Running') { throw 'Backup controller is already active; inspect it before restarting.' }
          $receipt=Join-Path $root 'launch-status-backup.json'
          if (Test-Path $receipt) {
            $old=Get-Content $receipt -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($old.state -eq 'requesting') { throw 'Previous dispatch ambiguous; do not send another request.' }
          }
          # Only presentation and next-launch scripts. Active primary controller keeps its loaded functions.
          $source=Join-Path $env:GITHUB_WORKSPACE 'recovery-source\jx_fares\desktop_pet'
          foreach ($name in @('ContinuousScan.ps1','Start-DesktopScan.ps1','Start-ProgressPet.ps1')) {
            $body=Get-Content (Join-Path $source $name) -Raw -Encoding UTF8
            [IO.File]::WriteAllText((Join-Path $root $name),$body,[Text.UTF8Encoding]::new($true))
          }
          $healthPath=Join-Path $root 'widget-status.json'
          $oldPid=0
          if (Test-Path $healthPath) {
            $health=Get-Content $healthPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $oldPid=[int]$health.pid
            $process=Get-CimInstance Win32_Process -Filter "ProcessId=$oldPid"
            $expected=Join-Path $root 'Start-ProgressPet.ps1'
            if ($process -and (!$process.CommandLine -or $process.CommandLine.IndexOf($expected,[StringComparison]::OrdinalIgnoreCase) -lt 0)) { throw 'Widget process identity changed; no process stopped.' }
          }
          Stop-ScheduledTask -TaskName 'AS-Award-ProgressPet' -ErrorAction Stop
          Start-Sleep -Seconds 2
          if ($oldPid -gt 0) {
            $process=Get-CimInstance Win32_Process -Filter "ProcessId=$oldPid"
            if ($process) {
              $expected=Join-Path $root 'Start-ProgressPet.ps1'
              if ($process.CommandLine -and $process.CommandLine.IndexOf($expected,[StringComparison]::OrdinalIgnoreCase) -ge 0) { Stop-Process -Id $oldPid -ErrorAction Stop }
              else { throw 'Old widget PID reused; refusing restart.' }
            }
          }
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          Start-ScheduledTask -TaskName 'AS-Award-ProgressPet'
          $ready=$false
          for ($i=0;$i -lt 20;$i++) {
            Start-Sleep -Seconds 1
            try { $health=Get-Content $healthPath -Raw -Encoding UTF8 | ConvertFrom-Json } catch { continue }
            if ($health.version -eq 11 -and $health.visible -and $health.at -ge $started) { $ready=$true;break }
          }
          if (!$ready) { throw 'Updated widget did not report ready; backup not dispatched.' }
          Write-Host ('[widget] version='+$health.version+' visible='+$health.visible)
          if (Test-Path $receipt) { Copy-Item $receipt (Join-Path $env:RUNNER_TEMP 'backup-launch-before-recovery.json') -Force }
          Remove-Item (Join-Path $root 'stop-continuous-backup') -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $root 'cancel-launch-backup') -ErrorAction SilentlyContinue
          New-Item -ItemType File -Path (Join-Path $root 'continuous-enabled-backup') -Force | Out-Null
          $requested=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          Start-ScheduledTask -TaskName $taskName
          for ($i=0;$i -lt 50;$i++) {
            Start-Sleep -Seconds 2
            try { $fresh=Get-Content $receipt -Raw -Encoding UTF8 | ConvertFrom-Json } catch { continue }
            if ($fresh.at -lt $requested) { continue }
            Write-Host ('[backup-controller] state='+$fresh.state+' enabled='+$fresh.enabled+' run='+$fresh.run_id+' error='+$fresh.error_code)
            if ($fresh.enabled -and $fresh.run_id -match '^\d+$' -and $fresh.state -in @('requested','running_continuous','waiting_verification')) { exit 0 }
            if (!$fresh.enabled) { throw 'Backup controller stopped; inspect recorded state.' }
          }
          throw 'Dispatch confirmation timed out; do not repeat automatically.'
