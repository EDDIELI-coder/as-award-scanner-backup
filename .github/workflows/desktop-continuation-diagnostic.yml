name: Desktop continuation metadata diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/desktop-continuation-diagnostic.yml', '.github/scripts/Test-DesktopContinuation.ps1']
  pull_request:
    paths: ['.github/workflows/desktop-continuation-diagnostic.yml', '.github/scripts/Test-DesktopContinuation.ps1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Test-DesktopContinuation.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) {throw ($errors | Out-String)}
  diagnose:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: continuation-diagnostic
      - shell: powershell
        run: ./continuation-diagnostic/.github/scripts/Test-DesktopContinuation.ps1
