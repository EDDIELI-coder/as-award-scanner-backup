name: 套用無 Terminal 視窗的本機啟動器
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-gui-entry.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-gui-entry
  cancel-in-progress: false
jobs:
  update:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: c811677d922d62b29123831cd4f71851fa44967a
          token: ${{ secrets.DATA_TOKEN }}
          persist-credentials: false
          path: gui-source
      - name: 選取既有 Windows Python
        shell: powershell
        run: ./gui-source/jx_fares/tools/Select-WindowsRunnerTools.ps1
      - name: 本機實測 GUI 啟動、後代程序與 Terminal 可見性
        shell: powershell
        env:
          AS_TEST_WINDOWS_GUI: '1'
        run: |
          & $env:AS_SCAN_PYTHON -m unittest discover -s gui-source/jx_fares -p test_terminal_launch.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Local Terminal lifecycle check failed; existing tasks left untouched.' }
      - name: 更新五個啟動入口，保留 runner 與目前掃描
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tools=Join-Path $env:GITHUB_WORKSPACE 'gui-source\jx_fares\tools'
          . (Join-Path $tools 'GuiPowerShell.ps1')
          $pythonw=Get-AsGuiPython
          $pet=Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet'
          # Preserve the existing enabled modes and their exact run receipts.
          $resume=@{}
          $controllerProcesses=@()
          foreach ($part in @('primary','backup')) {
            $resume[$part]=Test-Path (Join-Path $pet "continuous-enabled-$part")
            $script=Join-Path $pet 'Start-DesktopScan.ps1'
            $controllerRows=@(Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object {
              $_.CommandLine -and $_.CommandLine.IndexOf($script,[StringComparison]::OrdinalIgnoreCase) -ge 0 -and $_.CommandLine -match ("-Partition\s+"+$part+"\b")
            })
            if ($controllerRows.Count -gt 1) { throw 'Ambiguous controller processes; nothing stopped.' }
            $controllerProcesses+=@($controllerRows)
          }
          foreach ($part in @('primary','backup')) {
            $task=Get-ScheduledTask -TaskName "AS-Award-home-$part" -ErrorAction Stop
            $old=$task.Actions[0].Arguments
            if ($old -notmatch '(?i)(?:-File|--script)\s+"([^"]+Start-LocalRunner\.ps1)"') { throw 'Unexpected runner action.' }
            $script=[IO.Path]::GetFullPath($Matches[1])
            $prefix=Join-Path $env:LOCALAPPDATA 'AsAwardSetup'
            if (!$script.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase)) { throw 'Runner script outside setup folder.' }
            $folder=Split-Path $script
            foreach ($name in @('GuiPowerShell.ps1','HiddenPowerShell.pyw','Enable-LocalRunner.ps1','RunnerProcess.ps1','Start-LocalRunner.ps1')) {
              $target=Join-Path $folder $name
              if ((Test-Path $target) -and !(Test-Path ($target+'.before-gui'))) { Copy-Item $target ($target+'.before-gui') }
              $body=Get-Content (Join-Path $tools $name) -Raw -Encoding UTF8
              [IO.File]::WriteAllText($target,$body,[Text.UTF8Encoding]::new($true))
            }
            $action=New-AsGuiAction $script "-Device home -Partition $part -Background -NoStartQuery" $folder
            Set-ScheduledTask -TaskName $task.TaskName -Action $action | Out-Null
            Write-Host ("GUI action installed for "+$task.TaskName+"; active runner not restarted.")
          }
          # Controllers poll metadata only. Stop them after validating/copying
          # the new launchers; real runner and Chrome processes remain untouched.
          foreach ($process in $controllerProcesses) { Stop-Process -Id $process.ProcessId -ErrorAction Stop }
          $healthPath=Join-Path $pet 'widget-status.json'
          if (Test-Path $healthPath) {
            $old=Get-Content $healthPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $process=Get-CimInstance Win32_Process -Filter ("ProcessId = "+[int]$old.pid)
            $expected=Join-Path $pet 'Start-ProgressPet.ps1'
            if ($process -and $process.Name -eq 'powershell.exe' -and $process.CommandLine.IndexOf($expected,[StringComparison]::OrdinalIgnoreCase) -ge 0) {
              Stop-Process -Id $process.ProcessId -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2
          & ./gui-source/jx_fares/desktop_pet/Install-ProgressPet.ps1 -Device home
          foreach ($part in @('primary','backup')) {
            if ($resume[$part]) {
              New-Item -ItemType File -Path (Join-Path $pet "continuous-enabled-$part") -Force | Out-Null
              Start-ScheduledTask -TaskName "AS-Award-Continuous-home-$part"
            }
          }
          $ready=$false
          for ($i=0;$i -lt 20;$i++) {
            Start-Sleep -Seconds 2
            $health=Get-Content $healthPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($health.version -eq 10 -and $health.visible -and ([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()-$health.at) -lt 15000) { $ready=$true;break }
          }
          if (!$ready) { throw 'GUI-launched v10 widget did not report a fresh visible UI.' }
          foreach ($name in @('AS-Award-home-primary','AS-Award-home-backup','AS-Award-Continuous-home-primary','AS-Award-Continuous-home-backup','AS-Award-ProgressPet')) {
            $task=Get-ScheduledTask -TaskName $name
            if ([IO.Path]::GetFileName($task.Actions[0].Execute) -ne 'pythonw.exe') { throw 'A console entry point remains.' }
            [pscustomobject]@{task=$name;host=[IO.Path]::GetFileName($task.Actions[0].Execute);state=[string]$task.State} | ConvertTo-Json -Compress
          }
          Write-Host 'PASS: five GUI entries installed, v10 widget is live, existing scan processes preserved, no unrelated Terminal was closed.'
