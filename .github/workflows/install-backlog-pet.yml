name: Install backlog progress pet
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-backlog-pet.yml', '.github/scripts/Install-BacklogPet.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-backlog-progress-pet
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Install-BacklogPet.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) {throw ($errors | Out-String)}
  install:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: backlog-maintenance
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: bfa097471a4086484e9ab023b81cb39be5c5178e
          token: ${{ secrets.DATA_TOKEN }}
          path: backlog-source
          persist-credentials: false
      - shell: powershell
        run: ./backlog-maintenance/.github/scripts/Install-BacklogPet.ps1
