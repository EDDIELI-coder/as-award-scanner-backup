name: 安裝桌面哩程小飛行員（不查票）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-progress-pet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 5
    steps:
      - name: 取得已測試的桌面元件
        uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: c56c2f3e7a29466dac58289cedbbb7c1c02c97bc
          token: ${{ secrets.DATA_TOKEN }}
          persist-credentials: false
          path: progress-pet-source
      - name: 安裝這台電腦的進度元件，不動掃描與瀏覽器
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./progress-pet-source/jx_fares/desktop_pet/Test-ProgressPet.ps1
          $oldStatusPath = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\widget-status.json'
          $expectedScript = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\Start-ProgressPet.ps1'
          Stop-ScheduledTask -TaskName 'AS-Award-ProgressPet' -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $oldStatusPath) {
            $oldStatus = Get-Content -LiteralPath $oldStatusPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $oldProcess = Get-CimInstance Win32_Process -Filter ("ProcessId = " + [int]$oldStatus.pid)
            if ($oldProcess -and $oldProcess.Name -eq 'powershell.exe' -and $oldProcess.CommandLine.IndexOf($expectedScript, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              Stop-Process -Id ([int]$oldStatus.pid) -ErrorAction SilentlyContinue
              Write-Host 'Stopped the previous verified widget process only.'
            }
          }
          Start-Sleep -Seconds 2
          & ./progress-pet-source/jx_fares/desktop_pet/Install-ProgressPet.ps1 -Device home
          $path = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\widget-status.json'
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $alive = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            Start-Sleep -Seconds 2
            try {
              $status = Get-Content -LiteralPath $path -Raw -Encoding UTF8 -ErrorAction Stop | ConvertFrom-Json
              if ($status.at -ge $started -and $status.visible -eq $true -and $status.version -eq 3) {
                $process = Get-Process -Id $status.pid -ErrorAction Stop
                if ($process.ProcessName -eq 'powershell') { $alive = $true; break }
              }
            } catch { }
          }
          if (!$alive) { Get-Content -LiteralPath $path -Raw -Encoding UTF8; Get-ScheduledTask -TaskName 'AS-Award-ProgressPet' | Select-Object TaskName, State; throw 'Widget did not confirm a visible, live UI. Scanner unchanged.' }
          $originalPid = $status.pid
          $recallStarted = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $launcher = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\Start-ProgressPet.ps1'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -WindowStyle Hidden -File $launcher -Device home
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut recall failed.' }
          $recalled = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            Start-Sleep -Seconds 2
            $status = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($status.recalled_at -ge $recallStarted -and $status.visible -and $status.pid -eq $originalPid) { $recalled = $true; break }
          }
          if (!$recalled) { throw 'Existing widget did not confirm recall.' }
          Write-Host 'PASS: second launch recalled the same desktop widget process.'
          Get-ScheduledTask -TaskName 'AS-Award-ProgressPet' | Select-Object TaskName, State
          $status | Select-Object version, device, visible, at, hotkey, recalled_at | ConvertTo-Json -Compress
          Write-Host 'PASS: installed widget confirmed visible and refreshing; no airline query or runner restart.'
