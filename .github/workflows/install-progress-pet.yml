name: 安裝桌面哩程小飛行員（不查票）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-progress-pet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 5
    steps:
      - name: 取得已測試的桌面元件
        uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: 6bae9adae81b5f7cd29bebca592c6fec4562e368
          token: ${{ secrets.DATA_TOKEN }}
          persist-credentials: false
          path: progress-pet-source
      - name: 安裝這台電腦的進度元件，不動掃描與瀏覽器
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./progress-pet-source/jx_fares/desktop_pet/Test-ProgressPet.ps1
          $oldStatusPath = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\widget-status.json'
          $expectedScript = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\Start-ProgressPet.ps1'
          Stop-ScheduledTask -TaskName 'AS-Award-ProgressPet' -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $oldStatusPath) {
            $oldStatus = Get-Content -LiteralPath $oldStatusPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $oldProcess = Get-CimInstance Win32_Process -Filter ("ProcessId = " + [int]$oldStatus.pid)
            if ($oldProcess -and $oldProcess.Name -eq 'powershell.exe' -and $oldProcess.CommandLine.IndexOf($expectedScript, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              Stop-Process -Id ([int]$oldStatus.pid) -ErrorAction SilentlyContinue
              Write-Host 'Stopped the previous verified widget process only.'
            }
          }
          Start-Sleep -Seconds 2
          & ./progress-pet-source/jx_fares/desktop_pet/Install-ProgressPet.ps1 -Device home
          $path = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\widget-status.json'
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $alive = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            Start-Sleep -Seconds 2
            try {
              $status = Get-Content -LiteralPath $path -Raw -Encoding UTF8 -ErrorAction Stop | ConvertFrom-Json
              if ($status.at -ge $started -and $status.visible -eq $true -and $status.version -eq 7) {
                $process = Get-Process -Id $status.pid -ErrorAction Stop
                if ($process.ProcessName -eq 'powershell') { $alive = $true; break }
              }
            } catch { }
          }
          if (!$alive) { Get-Content -LiteralPath $path -Raw -Encoding UTF8; Get-ScheduledTask -TaskName 'AS-Award-ProgressPet' | Select-Object TaskName, State; throw 'Widget did not confirm a visible, live UI. Scanner unchanged.' }
          $originalPid = $status.pid
          $recallStarted = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $launcher = Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet\Start-ProgressPet.ps1'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -WindowStyle Hidden -File $launcher -Device home
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut recall failed.' }
          $recalled = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            Start-Sleep -Seconds 2
            $status = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($status.recalled_at -ge $recallStarted -and $status.visible -and $status.pid -eq $originalPid) { $recalled = $true; break }
          }
          if (!$recalled) { throw 'Existing widget did not confirm recall.' }
          Write-Host 'PASS: second launch recalled the same desktop widget process.'
          Get-ScheduledTask -TaskName 'AS-Award-ProgressPet' | Select-Object TaskName, State
          $status | Select-Object version, device, visible, at, hotkey, recalled_at | ConvertTo-Json -Compress
          Write-Host 'PASS: installed widget confirmed visible and refreshing; no airline query or runner restart.'
      - name: 在真正桌面環境檢查 gh 狀態並點擊助手主線按鈕
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet'
          $scriptPath=Join-Path $root 'Test-ActualDesktopClick.ps1'
          $resultPath=Join-Path $root 'actual-click-result.json'
          $body=@'
          $ErrorActionPreference='Stop'
          $steps=@()
          function Mark($Stage,$Outcome) { $script:steps+=@{stage=$Stage;outcome=$Outcome} }
          try {
            . (Join-Path $PSScriptRoot 'ProgressModel.ps1')
            . (Join-Path $PSScriptRoot 'ScanLauncher.ps1')
            foreach ($repo in @('EDDIELI-coder/as-award-scanner','EDDIELI-coder/as-award-scanner-backup')) {
              $raw=Invoke-PetGh -Arguments @('run','list','--workflow','scan.yml','--repo',$repo,'--limit','100','--json','status')
              $rows=@($raw | ConvertFrom-Json)
              Mark ('desktop_read_'+$repo.Split('/')[-1]) 'ok'
            }
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $health=Read-PetJson (Join-Path $PSScriptRoot 'widget-status.json')
            $condition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$health.pid)
            $window=[Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Children,$condition)
            if (!$window) { throw 'widget_window_missing' }
            $buttonCondition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,'StartPrimary')
            $button=$window.FindFirst([Windows.Automation.TreeScope]::Descendants,$buttonCondition)
            if (!$button -or !$button.Current.IsEnabled) { throw 'widget_button_unavailable' }
            $at=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $button.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
            Mark 'invoke_actual_widget_button' 'ok'
            $statusPath=Join-Path $PSScriptRoot 'launch-status-primary.json'
            for ($i=0;$i -lt 45;$i++) {
              Start-Sleep -Seconds 2
              $status=Read-PetJson $statusPath
              if ($status.at -ge $at -and $status.state -in @('requested','waiting_other','needs_verification','github_error','github_timeout','gh_missing','response_parse_error','unknown_scan_status','launcher_error')) { break }
            }
            if ($status.at -lt $at) { throw 'no_new_launch_receipt' }
            Mark 'actual_button_launch_result' $status.state
          } catch { $steps+=@{stage='failure';type=$_.Exception.GetType().FullName;line=$_.InvocationInfo.ScriptLineNumber} }
          $steps | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $PSScriptRoot 'actual-click-result.json') -Encoding UTF8
          '@
          [IO.File]::WriteAllText($scriptPath,$body,[Text.UTF8Encoding]::new($true))
          Remove-Item $resultPath -ErrorAction SilentlyContinue
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $exe=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $action=New-ScheduledTaskAction -Execute $exe -Argument ('-NoProfile -WindowStyle Hidden -File '+[char]34+$scriptPath+[char]34) -WorkingDirectory $root
          $principal=New-ScheduledTaskPrincipal -UserId $identity.User.Value -LogonType Interactive -RunLevel Limited
          $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 3)
          Register-ScheduledTask -TaskName 'AS-Award-Pet-ActualClickTest' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          try {
            Start-ScheduledTask -TaskName 'AS-Award-Pet-ActualClickTest'
            for ($i=0;$i -lt 60;$i++) { Start-Sleep -Seconds 2; if (Test-Path $resultPath) { break } }
            $results=Get-Content $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $results | ConvertTo-Json -Depth 4
            if (@($results | Where-Object {$_.stage -eq 'failure'}).Count -or !@($results | Where-Object {$_.stage -eq 'actual_button_launch_result' -and $_.outcome -in @('requested','waiting_other','needs_verification')}).Count) { throw 'Actual desktop click did not confirm an accepted request.' }
          } finally {
            Stop-ScheduledTask -TaskName 'AS-Award-Pet-ActualClickTest' -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName 'AS-Award-Pet-ActualClickTest' -Confirm:$false
            Remove-Item $scriptPath -ErrorAction SilentlyContinue
          }
