name: 修復保存卡點並啟用桌面連續掃描
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-progress-pet.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - name: 取得已通過 Windows 測試的桌面元件
        uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: db26cbce9eb0f68dbe1e041bd869d0da2d80ef91
          token: ${{ secrets.DATA_TOKEN }}
          persist-credentials: false
          path: progress-pet-source
      - name: 選取本機 Python
        shell: powershell
        run: ./progress-pet-source/jx_fares/tools/Select-WindowsRunnerTools.ps1
      - name: 備份及救回失敗工作的成果，原子歸還舊批次
        shell: powershell
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          RUNNER_API_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $body=@'
          import base64, hashlib, json, os, pathlib, shutil, sys, time
          sys.path.insert(0, str(pathlib.Path('progress-pet-source/jx_fares').resolve()))
          from runner_pool import API, serial_release, same_owner
          repo = 'EDDIELI-coder/as-award-scanner-backup'
          identity = dict(repo=repo, run='42408207416', attempt='1')
          api = API(os.environ['DATA_TOKEN'])
          runner = API(os.environ['RUNNER_API_TOKEN'], repo=repo)
          old = runner.request('actions/runs/' + identity['run'])
          if old.get('status') != 'completed' or old.get('conclusion') != 'failure':
              raise RuntimeError('Old workflow is not conclusively finished; recovery stopped')
          original = pathlib.Path(os.environ['LOCALAPPDATA']) / 'AsAwardRunner/home/backup/_work/as-award-scanner-backup/as-award-scanner-backup/data'
          summary = json.loads((original / 'scan_status.json').read_text(encoding='utf-8-sig'))
          if (str(summary.get('github_run_id')) != identity['run'] or
              str(summary.get('github_run_attempt')) != identity['attempt'] or
              summary.get('runner_repo') != repo or
              summary.get('successful_reads') != 38 or summary.get('blocked') or
              summary.get('stop_reason') != 'batch_limit'):
              raise RuntimeError('Saved local result identity changed; original files left intact')
          allowed = ['as_awards.json','scan_state.json','scan_status.json','scan_log.txt']
          allowed += [str(p.relative_to(original)).replace('\\','/') for p in (original / 'scan_results').glob('*.json')]
          if len(allowed) > 604:
              raise RuntimeError('Unexpected recovery file count')
          files = {name: (original/name).read_bytes() for name in allowed}
          if sum(map(len, files.values())) > 64*1024*1024:
              raise RuntimeError('Recovery exceeds expected data size')
          for name, content in files.items():
              if name.endswith('.json'):
                  json.loads(content.decode('utf-8-sig'))
          backup = pathlib.Path(os.environ['LOCALAPPDATA']) / 'AsAwardRecovered/42408207416'
          backup.mkdir(parents=True, exist_ok=True)
          for name, content in files.items():
              target = backup/name
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists() and target.read_bytes() != content:
                  raise RuntimeError('Existing safety copy differs; stopped without overwriting')
              target.write_bytes(content)
          print('Safety copy preserved; local successful reads:', summary['successful_reads'])
          # Immutable blobs can be reused when a different writer wins the branch race.
          entries=[]
          for name, content in files.items():
              blob=api.request('git/blobs','POST',{'encoding':'base64','content':base64.b64encode(content).decode()})
              if not blob.get('sha'):
                  raise RuntimeError('Snapshot blob was not saved')
              entries.append(dict(path='worker_data/backup/'+name,mode='100644',type='blob',sha=blob['sha']))
          for attempt in range(5):
              ref=api.request('git/ref/heads/award-data')
              parent=ref['object']['sha']
              commit=api.request('git/commits/'+parent)
              # Read everything from the exact parent, never a moving branch.
              def read_at(path, optional=False):
                  value=api.request('contents/'+path+'?ref='+parent)
                  if optional and value.get('_status') == 404:
                      return None
                  if not value.get('content'):
                      raise RuntimeError('Expected parent data is unavailable')
                  return json.loads(base64.b64decode(value['content']))
              pool=read_at('runner_pool.json')
              existing=read_at('worker_data/backup/scan_status.json',True)
              if existing and existing.get('finished_at','') > summary.get('finished_at',''):
                  raise RuntimeError('A newer backup result exists; old snapshot will not replace it')
              lease=pool.get('lease')
              if lease and not same_owner(lease,identity):
                  raise RuntimeError('A different legacy workflow owns the batch; stopped')
              replacement=serial_release(pool,identity,time.time(),clean=False) if lease else pool
              tree=api.request('git/trees','POST',{'base_tree':commit['tree']['sha'],'tree':entries+[
                  dict(path='runner_pool.json',mode='100644',type='blob',content=json.dumps(replacement,ensure_ascii=False,indent=2)+'\n')]})
              new=api.request('git/commits','POST',{'message':'救回備線 38 筆成果並歸還已失敗舊批次','tree':tree['sha'],'parents':[parent]})
              result=api.request('git/refs/heads/award-data','PATCH',{'sha':new['sha'],'force':False})
              if result.get('object',{}).get('sha') == new['sha']:
                  print('PASS: snapshot saved and old lease released in one commit:',new['sha'])
                  break
          else:
              raise RuntimeError('Concurrent publisher changed the branch; original data and safety copy preserved')
          '@
          & $env:AS_SCAN_PYTHON -c $body
          if ($LASTEXITCODE -ne 0) { throw 'Recovery did not complete; widget installation and new scans withheld.' }
      - name: 更新桌面助手並清理舊版等待程序
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./progress-pet-source/jx_fares/desktop_pet/Test-ProgressPet.ps1
          & ./progress-pet-source/jx_fares/desktop_pet/Test-ContinuousScan.ps1
          $root=Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet'
          $healthPath=Join-Path $root 'widget-status.json'
          $old=Get-Content $healthPath -Raw -Encoding UTF8 | ConvertFrom-Json
          Stop-ScheduledTask -TaskName 'AS-Award-ProgressPet' -ErrorAction SilentlyContinue
          $expected=Join-Path $root 'Start-ProgressPet.ps1'
          $widget=Get-CimInstance Win32_Process -Filter ('ProcessId = '+[int]$old.pid)
          if ($widget -and $widget.Name -eq 'powershell.exe' -and $widget.CommandLine.IndexOf($expected,[StringComparison]::OrdinalIgnoreCase) -ge 0) {
            Stop-Process -Id $old.pid -ErrorAction SilentlyContinue
          }
          # Old queued helpers only; never terminate runner, Python, Git or Chrome.
          if ([int]$old.version -lt 9) {
            $helper=Join-Path $root 'Start-DesktopScan.ps1'
            Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object {
              $_.ProcessId -ne $PID -and $_.CommandLine -and $_.CommandLine.IndexOf($helper,[StringComparison]::OrdinalIgnoreCase) -ge 0
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
            foreach ($part in @('primary','backup')) {
              Remove-Item (Join-Path $root "launch-status-$part.json") -ErrorAction SilentlyContinue
              Remove-Item (Join-Path $root "cancel-launch-$part") -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2
          & ./progress-pet-source/jx_fares/desktop_pet/Install-ProgressPet.ps1 -Device home
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $ready=$false
          for ($i=0;$i -lt 15;$i++) {
            Start-Sleep -Seconds 2
            $health=Get-Content $healthPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($health.version -eq 9 -and $health.visible -and $health.at -ge $started) { $ready=$true;break }
          }
          if (!$ready) { throw 'Updated widget has not confirmed a fresh visible heartbeat.' }
          Write-Host 'PASS: version 9 is installed and visible on the actual desktop.'
      - name: 由真正桌面按鈕啟用主備連續掃描並核對收據
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet'
          $scriptPath=Join-Path $root 'Test-ActualDesktopContinuous.ps1'
          $resultPath=Join-Path $root 'actual-continuous-result.json'
          $body=@'
          $ErrorActionPreference='Stop'
          $steps=@()
          try {
            . (Join-Path $PSScriptRoot 'ProgressModel.ps1')
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $health=Read-PetJson (Join-Path $PSScriptRoot 'widget-status.json')
            $condition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$health.pid)
            $window=[Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Children,$condition)
            if (!$window) { throw 'widget_window_missing' }
            foreach ($part in @('primary','backup')) {
              $at=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              if (!(Test-Path (Join-Path $PSScriptRoot "continuous-enabled-$part"))) {
                $id=if ($part -eq 'primary') {'StartPrimary'} else {'StartBackup'}
                $condition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::AutomationIdProperty,$id)
                $button=$window.FindFirst([Windows.Automation.TreeScope]::Descendants,$condition)
                if (!$button -or !$button.Current.IsEnabled) { throw 'widget_button_unavailable' }
                $button.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
              }
              $accepted=$false
              for ($i=0;$i -lt 40;$i++) {
                Start-Sleep -Seconds 2
                $status=Read-PetJson (Join-Path $PSScriptRoot "launch-status-$part.json")
                if ($status.at -ge $at -and $status.enabled -and $status.state -in @('requested','running_continuous','waiting_verification','next_batch')) { $accepted=$true;break }
              }
              if (!$accepted) { throw 'continuous_controller_not_confirmed' }
              $steps+=@{partition=$part;state=$status.state;enabled=$status.enabled;run_id=$status.run_id}
            }
          } catch { $steps+=@{failure=$_.Exception.Message;line=$_.InvocationInfo.ScriptLineNumber} }
          $steps | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $PSScriptRoot 'actual-continuous-result.json') -Encoding UTF8
          '@
          [IO.File]::WriteAllText($scriptPath,$body,[Text.UTF8Encoding]::new($true))
          Remove-Item $resultPath -ErrorAction SilentlyContinue
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $exe=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $action=New-ScheduledTaskAction -Execute $exe -Argument ('-NoProfile -WindowStyle Hidden -File '+[char]34+$scriptPath+[char]34) -WorkingDirectory $root
          $principal=New-ScheduledTaskPrincipal -UserId $identity.User.Value -LogonType Interactive -RunLevel Limited
          $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 4)
          Register-ScheduledTask -TaskName 'AS-Award-Pet-ActualContinuousTest' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          try {
            Start-ScheduledTask -TaskName 'AS-Award-Pet-ActualContinuousTest'
            for ($i=0;$i -lt 100;$i++) { Start-Sleep -Seconds 2;if (Test-Path $resultPath) { break } }
            $results=Get-Content $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $results | ConvertTo-Json -Depth 4
            if (@($results | Where-Object {$_.failure}).Count -or @($results | Where-Object {$_.enabled -eq $true}).Count -ne 2) {
              throw 'Both actual desktop buttons must confirm enabled controllers.'
            }
            Write-Host 'PASS: both desktop buttons confirmed live independent continuous controllers; scanner execution is checked separately.'
          } finally {
            Stop-ScheduledTask -TaskName 'AS-Award-Pet-ActualContinuousTest' -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName 'AS-Award-Pet-ActualContinuousTest' -Confirm:$false
            Remove-Item $scriptPath -ErrorAction SilentlyContinue
          }
