name: 只讀檢查掃描終端機視窗
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-terminal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 3
    steps:
      - name: 只列程序身分與視窗類型，不讀輸入或完整命令
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $all=@(Get-CimInstance Win32_Process)
          $owned=@($all | Where-Object { $_.Name -in @('powershell.exe','pythonw.exe','python.exe','cmd.exe') -and $_.CommandLine -match '(?i)AsAwardProgressPet|AsAwardSetup|AsAwardRunner' })
          $owned | ForEach-Object {
            $role=if ($_.CommandLine -match 'Start-DesktopScan') {'controller'} elseif ($_.CommandLine -match 'Start-ProgressPet') {'widget'} elseif ($_.CommandLine -match 'Start-LocalRunner') {'runner_launcher'} else {'related'}
            [pscustomobject]@{pid=$_.ProcessId;parent=$_.ParentProcessId;name=$_.Name;role=$role;session=$_.SessionId}
          } | ConvertTo-Json -Compress
          $all | Where-Object { $_.Name -in @('WindowsTerminal.exe','OpenConsole.exe','conhost.exe','Runner.Listener.exe') } | Select-Object @{n='pid';e={$_.ProcessId}},@{n='parent';e={$_.ParentProcessId}},Name,SessionId | ConvertTo-Json -Compress
          Add-Type -TypeDefinition @'
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class TerminalAudit {
            public delegate bool Visit(IntPtr hwnd, IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Visit callback, IntPtr arg);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr hwnd, StringBuilder name, int size);
          }
          '@
          $windows=[Collections.Generic.List[object]]::new()
          $callback=[TerminalAudit+Visit]{param($hwnd,$arg)
            $name=[Text.StringBuilder]::new(256);[void][TerminalAudit]::GetClassName($hwnd,$name,256)
            if ($name.ToString() -match 'CASCADIA|ConsoleWindowClass') {
              [uint32]$owner=0;[void][TerminalAudit]::GetWindowThreadProcessId($hwnd,[ref]$owner)
              $windows.Add([pscustomobject]@{handle=$hwnd.ToInt64();pid=$owner;class=$name.ToString();visible=[TerminalAudit]::IsWindowVisible($hwnd)})
            }
            return $true
          }
          [void][TerminalAudit]::EnumWindows($callback,[IntPtr]::Zero)
          $windows | ConvertTo-Json -Compress
          foreach ($name in @('AS-Award-home-primary','AS-Award-home-backup','AS-Award-Continuous-home-primary','AS-Award-Continuous-home-backup','AS-Award-ProgressPet')) {
            $task=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            if ($task) { [pscustomobject]@{task=$name;state=[string]$task.State;host=[IO.Path]::GetFileName($task.Actions[0].Execute)} | ConvertTo-Json -Compress }
          }
