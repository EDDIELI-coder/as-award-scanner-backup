name: 診斷助手桌面啟動（只讀，不查票）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-pet-launch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 5
    steps:
      - name: 在與助手相同的登入桌面執行只讀診斷
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'AsAwardProgressPet'
          foreach ($partition in @('primary','backup')) {
            $saved=Join-Path $root "launch-status-$partition.json"
            if (Test-Path $saved) { Get-Content $saved -Raw -Encoding UTF8 }
          }
          $scriptPath=Join-Path $root 'Diagnose-Launcher.ps1'
          $resultPath=Join-Path $root 'diagnostic-result.json'
          $script=@'
          $ErrorActionPreference='Stop'
          $steps=@()
          function Mark($Stage,$Outcome) { $script:steps+=@{stage=$Stage;outcome=$Outcome} }
          try {
            . (Join-Path $PSScriptRoot 'ProgressModel.ps1')
            . (Join-Path $PSScriptRoot 'ScanLauncher.ps1')
            Mark 'load_modules' 'ok'
            $views=@(Get-PetSnapshots (Join-Path $env:LOCALAPPDATA 'AsAwardRunner') 'home')
            Mark 'read_progress' 'ok'
            $now=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $decision=Get-PetQueueDecision $views $now 0 0
            Mark 'queue_decision' $decision
            $gh=Get-Command gh.exe -ErrorAction Stop
            Mark 'find_gh' 'ok'
            foreach ($repo in @('EDDIELI-coder/as-award-scanner','EDDIELI-coder/as-award-scanner-backup')) {
              $data=Invoke-PetGh -Arguments @('api',"repos/$repo/actions/workflows/scan.yml/runs?per_page=100") | ConvertFrom-Json
              if (!$data.PSObject.Properties['workflow_runs']) { throw 'unknown_scan_status' }
              Mark ('read_'+$repo.Split('/')[-1]) 'ok'
            }
            function Invoke-PetScanDispatch { param($Device,$Partition) return 'diagnostic_only' }
            $outcome=Invoke-PetSerializedDispatch 'home' 'primary' $PSScriptRoot
            Mark 'serialized_check_no_dispatch' $outcome
          } catch {
            $steps+=@{stage='failure';type=$_.Exception.GetType().FullName;line=$_.InvocationInfo.ScriptLineNumber;file=[IO.Path]::GetFileName($_.InvocationInfo.ScriptName);code=if ($_.Exception.Message -match '^(github_timeout|github_unavailable|unknown_scan_status)$') {$_.Exception.Message} else {'unexpected_exception'}}
          }
          $steps | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $PSScriptRoot 'diagnostic-result.json') -Encoding UTF8
          '@
          [IO.File]::WriteAllText($scriptPath,$script,[Text.UTF8Encoding]::new($true))
          Remove-Item $resultPath -ErrorAction SilentlyContinue
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $exe=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $action=New-ScheduledTaskAction -Execute $exe -Argument ("-NoProfile -WindowStyle Hidden -File "+[char]34+$scriptPath+[char]34) -WorkingDirectory $root
          $principal=New-ScheduledTaskPrincipal -UserId $identity.User.Value -LogonType Interactive -RunLevel Limited
          $settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 3)
          Register-ScheduledTask -TaskName 'AS-Award-Pet-Diagnostic' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
          try {
            Start-ScheduledTask -TaskName 'AS-Award-Pet-Diagnostic'
            for ($i=0;$i -lt 60;$i++) { Start-Sleep -Seconds 2; if (Test-Path $resultPath) { break } }
            if (!(Test-Path $resultPath)) { throw 'Desktop diagnostic did not return.' }
            Get-Content $resultPath -Raw -Encoding UTF8
          } finally {
            Stop-ScheduledTask -TaskName 'AS-Award-Pet-Diagnostic' -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName 'AS-Award-Pet-Diagnostic' -Confirm:$false
            Remove-Item $scriptPath -ErrorAction SilentlyContinue
          }
