name: Install hidden progress pet
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-hidden-pet.yml', '.github/scripts/Install-HiddenPet.ps1']
  pull_request:
    paths: ['.github/workflows/install-hidden-pet.yml', '.github/scripts/Install-HiddenPet.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-hidden-progress-pet
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Install-HiddenPet.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) {throw ($errors | Out-String)}
  install:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Windows, X64, as-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: hidden-pet-maintenance
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: b4939d29145807b54de5d91021f43449685a51f0
          token: ${{ secrets.DATA_TOKEN }}
          path: hidden-pet-source
          persist-credentials: false
      - shell: powershell
        run: ./hidden-pet-maintenance/.github/scripts/Install-HiddenPet.ps1
