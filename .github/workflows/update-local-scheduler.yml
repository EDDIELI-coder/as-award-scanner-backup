name: Update local continuous scheduler
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-local-scheduler.yml', '.github/scripts/Update-ContinuousPet.ps1']
  workflow_dispatch:
    inputs:
      device:
        type: choice
        options: [home, office]
        default: home
permissions:
  contents: read
concurrency:
  group: update-local-scheduler
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Update-ContinuousPet.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          Write-Host 'Native installer syntax passed.'
          ./.github/scripts/Test-ContinuousPetRecovery.ps1
  update:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Windows, X64, "${{ format('as-{0}', inputs.device || 'home') }}"]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: scheduler-maintenance
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EDDIELI-coder/claude--
          ref: 2063201ab62bc9b8e8ecd10191bb5d7510b88ce9
          token: ${{ secrets.DATA_TOKEN }}
          path: scheduler-source
          persist-credentials: false
      - shell: powershell
        run: ./scheduler-maintenance/.github/scripts/Update-ContinuousPet.ps1 -Device '${{ inputs.device || 'home' }}'
